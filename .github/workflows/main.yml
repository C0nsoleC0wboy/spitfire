name: run main.py

on:
  repository_dispatch: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v4 # Updated from v2 to v4

      - name: setup python
        uses: actions/setup-python@v5 # Updated from v4 to v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: execute py script # run main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          CHAT_ID: ${{ secrets.CHANNEL_ID }}
        run: python main.py

      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "updated logs" --allow-empty)

      - name: push changes
        uses: ad-m/github-push-action@master # Updated to @master or the newest stable release tag
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
